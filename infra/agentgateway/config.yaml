# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# 宿主机验收剖面，语义与 config.docker.yaml 一致。

gateways:
  default:
    port: 8300
    apiKey:
      mode: strict
      keys:
      - key: "$GATEWAY_API_KEY"
        metadata:
          user: agenthub-orchestrator
          role: orchestrator
      - key: "$HERMES_GATEWAY_API_KEY"
        metadata:
          user: qishuo
          role: hermes

routes:
- name: agenthub-hermes-entry
  matches:
  - path:
      pathPrefix: /agenthub
  policies:
    urlRewrite:
      path:
        prefix: /
    authorization:
      rules:
      - require: 'apiKey.role == "hermes"'
    localRateLimit:
    - maxTokens: 30
      tokensPerFill: 30
      fillInterval: 60s
      type: requests
    timeout:
      requestTimeout: 900s
  backends:
  - host: 127.0.0.1:8310
    policies:
      backendAuth:
        key:
          value: "$HERMES_BACKEND_TOKEN"

- name: agenthub-dynamic-workers
  matches:
  - path:
      pathPrefix: /agents
  policies:
    urlRewrite:
      path:
        prefix: /worker-proxy
    authorization:
      rules:
      - require: 'apiKey.role == "orchestrator"'
    localRateLimit:
    - maxTokens: 30
      tokensPerFill: 30
      fillInterval: 60s
      type: requests
    timeout:
      requestTimeout: 900s
  backends:
  - host: 127.0.0.1:8310
    policies:
      backendAuth:
        key:
          value: "$GATEWAY_API_KEY"
