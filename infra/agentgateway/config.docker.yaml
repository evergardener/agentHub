# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Docker 生产剖面：qishuo 只能访问单一 agentHub 入口；
# orchestrator 通过通配 worker 路由回到 Registry 动态代理。

gateways:
  default:
    port: 8300
    apiKey:
      mode: strict
      keys:
      - key: "$GATEWAY_API_KEY"
        metadata:
          user: agenthub-orchestrator
          role: orchestrator
      - key: "$HERMES_GATEWAY_API_KEY"
        metadata:
          user: qishuo
          role: hermes

routes:
- name: agenthub-hermes-entry
  matches:
  - path:
      pathPrefix: /agenthub
  policies:
    urlRewrite:
      path:
        prefix: /
    authorization:
      rules:
      - require: 'apiKey.role == "hermes"'
    localRateLimit:
    - maxTokens: 30
      tokensPerFill: 30
      fillInterval: 60s
      type: requests
    timeout:
      requestTimeout: 900s
    retry:
      attempts: 2
      backoff: 500ms
      codes: [502, 503]
  backends:
  - host: orchestrator:8310
    policies:
      backendAuth:
        key:
          value: "$HERMES_BACKEND_TOKEN"

- name: agenthub-dynamic-workers
  matches:
  - path:
      pathPrefix: /agents
  policies:
    urlRewrite:
      path:
        prefix: /worker-proxy
    authorization:
      rules:
      - require: 'apiKey.role == "orchestrator"'
    localRateLimit:
    - maxTokens: 30
      tokensPerFill: 30
      fillInterval: 60s
      type: requests
    timeout:
      requestTimeout: 900s
    retry:
      attempts: 2
      backoff: 500ms
      codes: [502, 503]
  backends:
  - host: orchestrator:8310
    policies:
      backendAuth:
        key:
          value: "$GATEWAY_API_KEY"
