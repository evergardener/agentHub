# agentHub 控制面 compose 栈（Evolution v3 M2/M3）
#
# 拓扑：
#   容器内：nats / postgres / state-writer / janitor / agentgateway
#   宿主机：worker adapter（codex/kimi/dsh/pi...，用户自装），心跳注册进 agentHub
#   宿主机 worker 配置：LAS_NATS_URL=nats://127.0.0.1:4222
#                      LAS_AGENT_ENDPOINT=http://host.docker.internal:<port>
# 状态库：默认 compose PostgreSQL；回退 SQLite 在 .env 设
#   LAS_DATABASE_URL=sqlite:////data/workspace/runtime/agent-state.db
# 用法：
#   cp .env.example .env  # 填 LAS_LLM_API_KEY / LAS_GATEWAY_API_KEY
#   docker compose up -d                 # 控制面
#   docker compose run --rm agentctl chat   # 与 hermes 对话（交互 CLI）

# Compose 身份与仓库品牌一致。历史 local-agent-system 数据通过经校验的
# control-plane 备份恢复到本项目的新命名卷；不要绕过备份直接改此名称。
name: agenthub

x-agenthub: &agenthub
  image: agenthub:latest
  build: .
  mem_limit: 512m
  cpus: "1.0"
  pids_limit: 256
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-agenthub-env: &agenthub-env
  LAS_PRODUCTION_MODE: "true"
  LAS_NATS_URL: nats://nats:4222
  LAS_WORKSPACE: /data/workspace
  LAS_DATABASE_URL: postgresql://agenthub:${LAS_PG_PASSWORD:-agenthub-dev-only}@postgres:5432/agenthub
  LAS_OTEL_ENDPOINT: http://jaeger:4318   # 置空即关闭 tracing
  LAS_ACTION_RECEIPT_SECRET: ${LAS_ACTION_RECEIPT_SECRET:-}
  LAS_REQUIRE_MIGRATION_BACKUP: "true"
  LAS_MIGRATION_BACKUP_MAX_AGE: ${LAS_MIGRATION_BACKUP_MAX_AGE:-86400}

services:
  nats:
    image: nats:2.11.17-alpine3.22@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"   # 宿主机 worker 经此接入
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: ${LAS_PG_PASSWORD:-agenthub-dev-only}  # 生产请改（.env）
      POSTGRES_DB: agenthub
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 宿主机工具/调试可直连
    mem_limit: 1g
    cpus: "2.0"
    pids_limit: 256
    shm_size: 256mb
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  state-writer:
    <<: *agenthub
    # 显式声明入口：不依赖镜像 CMD（2026-08-19 教训：docker commit 热修
    # 会把 webui 的 Cmd 烘进镜像，未声明 command 的服务会被劫持）
    command: ["python", "-m", "state.writer"]
    environment: *agenthub-env
    volumes:
      - agent-data:/data
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "database-nats"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  janitor:
    <<: *agenthub
    command: ["python", "-m", "state.janitor"]
    environment:
      <<: *agenthub-env
      # 仅对这两个生产工作区根目录执行产物缺失对账；
      # 历史测试的 /tmp 路径保留在 DB 但不会触发生产告警。
      LAS_ARTIFACT_ROOTS: /data/workspace,${HOME}/AgentWorkspace
    volumes:
      - agent-data:/data
      # Host adapters persist canonical artifacts here. Mount the identical
      # absolute path read-only so artifact existence checks do not false-alarm.
      - ${HOME}/AgentWorkspace:${HOME}/AgentWorkspace:ro
    depends_on:
      state-writer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "database"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped

  notifier:
    <<: *agenthub
    command: ["python", "-m", "state.notifier"]
    environment:
      <<: *agenthub-env
      LAS_ALERT_WEBHOOK_URL: ${LAS_ALERT_WEBHOOK_URL:-}
      LAS_ALERT_WEBHOOK_TOKEN: ${LAS_ALERT_WEBHOOK_TOKEN:-}
      LAS_ALERT_POLL_INTERVAL: ${LAS_ALERT_POLL_INTERVAL:-10}
      LAS_ALERT_WEBHOOK_TIMEOUT: ${LAS_ALERT_WEBHOOK_TIMEOUT:-10}
    volumes:
      - agent-data:/data
    depends_on:
      state-writer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "database"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped

  agentgateway:
    <<: *agenthub
    command: ["agentgateway", "-f", "/app/infra/agentgateway/config.docker.yaml"]
    environment:
      # 在 .env 里配置 LAS_GATEWAY_API_KEY；留空则 gateway 拒绝所有请求
      GATEWAY_API_KEY: ${LAS_GATEWAY_API_KEY:-}
      HERMES_GATEWAY_API_KEY: ${LAS_HERMES_GATEWAY_API_KEY:-}
      HERMES_BACKEND_TOKEN: ${LAS_HERMES_BACKEND_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 访问宿主机 worker
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      - nats
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "tcp", "127.0.0.1", "8300"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # 外部总控（用户自建 hermes）的 A2A 接入端点（Evolution v3 §6 延伸）
  orchestrator:
    <<: *agenthub
    command: ["python", "-m", "orchestrator.a2a_server"]
    environment:
      <<: *agenthub-env
      LAS_GATEWAY_URL: http://agentgateway:8300
      LAS_GATEWAY_API_KEY: ${LAS_GATEWAY_API_KEY:-}
      LAS_API_TOKEN: ${LAS_API_TOKEN:-}
      LAS_ADAPTER_TOKEN: ${LAS_ADAPTER_TOKEN:-}
      LAS_A2A_PEERS: ${LAS_A2A_PEERS:-}   # hermes caller token→peer 映射（JSON）
      LAS_ORCH_REQUIRE_AUTH: "true"
      LAS_ORCH_BIND: 0.0.0.0   # 容器内监听；宿主映射收 loopback
      LAS_ORCH_PUBLIC_URL: http://127.0.0.1:8300/agenthub
    ports:
      - "127.0.0.1:8310:8310"
    depends_on:
      state-writer:
        condition: service_healthy
      agentgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "http", "http://127.0.0.1:8310/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Web UI（Evolution v3 §5.2）：看板 / 任务详情 / 事件流 / 审批中心
  webui:
    <<: *agenthub
    command: ["python", "-m", "webui.server"]
    environment:
      <<: *agenthub-env
      LAS_WEBUI_HOST: 0.0.0.0
      LAS_WEBUI_PORT: "8080"
      LAS_GATEWAY_URL: http://agentgateway:8300
      LAS_GATEWAY_API_KEY: ${LAS_GATEWAY_API_KEY:-}
      LAS_ADAPTER_TOKEN: ${LAS_ADAPTER_TOKEN:-}
      # WebUI 控制面默认 fail-closed；先在 .env 配 token→role 和 session HMAC
      LAS_WEBUI_REQUIRE_AUTH: "true"
      LAS_WEBUI_TOKENS: ${LAS_WEBUI_TOKENS:-}
      LAS_WEBUI_SESSION_SECRET: ${LAS_WEBUI_SESSION_SECRET:-}
      LAS_WEBUI_SESSION_TTL: ${LAS_WEBUI_SESSION_TTL:-28800}
      LAS_WEBUI_COOKIE_SECURE: ${LAS_WEBUI_COOKIE_SECURE:-false}
      # 宿主机工作区（host adapter 产物路径以此绝对路径入库）；
      # 下方以相同路径只读挂载，artifact-content 端点据此放行读取
      LAS_WEBUI_ARTIFACT_ROOTS: ${HOME}/AgentWorkspace
    volumes:
      - agent-data:/data
      - ${HOME}/AgentWorkspace:${HOME}/AgentWorkspace:ro
    ports:
      - "127.0.0.1:18070:8080"  # 仍仅 loopback；另有应用层认证/CSRF/RBAC
    depends_on:
      state-writer:
        condition: service_healthy
      agentgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "common.healthcheck", "http", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # OTel 收集 + 查询界面（Evolution v3 §5.1）；应用经 LAS_OTEL_ENDPOINT 上报
  jaeger:
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    ports:
      - "127.0.0.1:16686:16686"  # 查询 UI
      - "127.0.0.1:4318:4318"    # OTLP HTTP（宿主机进程也可上报，仅回环）
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    logging: *default-logging
    restart: unless-stopped

  # 交互式 CLI：docker compose run --rm agentctl chat
  agentctl:
    <<: *agenthub
    profiles: ["cli"]
    entrypoint: ["agentctl"]
    command: ["chat"]
    stdin_open: true
    tty: true
    environment:
      <<: *agenthub-env
      LAS_GATEWAY_URL: http://agentgateway:8300
      LAS_GATEWAY_API_KEY: ${LAS_GATEWAY_API_KEY:-}
      LAS_ADAPTER_TOKEN: ${LAS_ADAPTER_TOKEN:-}   # 经 gateway 透传给宿主机 adapter
      # 容器内访问宿主机 cliproxy 的固定写法（宿主机进程的 127.0.0.1 视角
      # 在 .env；此处是容器视角，不随 .env 覆盖）
      LAS_LLM_BASE_URL: http://host.docker.internal:8317/v1
      LAS_LLM_API_KEY: ${LAS_LLM_API_KEY:-}
      LAS_LLM_MODEL: ${LAS_LLM_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      LAS_HINDSIGHT_URL: ${LAS_HINDSIGHT_URL:-http://host.docker.internal:18888}
      LAS_HINDSIGHT_API_KEY: ${LAS_HINDSIGHT_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent-data:/data
    depends_on:
      state-writer:
        condition: service_started

volumes:
  nats-data:
  agent-data:
  pg-data:

# Keep Docker Desktop allocations outside the physical 192.168.7.0/24 LAN.
networks:
  default:
    name: agenthub_default
    ipam:
      config:
        # 与保留供回退的 local-agent-system_default (10.252.0.0/24) 并存。
        - subnet: 10.253.0.0/24
