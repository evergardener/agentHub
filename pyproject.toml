[project]
name = "local-agent-system"
version = "0.1.0"
description = "Hermes-orchestrated local multi-agent collaboration system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "nats-py>=2.10",
    "pyyaml>=6",
    "fastmcp>=3.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
agentctl = "cli.agentctl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
