# Hermes 审批策略 — Evolution v3 §6.2 / §6.2.1
# 关键词匹配（包含即命中）。粒度后续可升级为结构化操作类型。

auto_approve:        # 明确命中的只读/查询类：hermes 直接批准
  - 查询
  - 读取
  - 分析
  - 检索
  - 总结
  - 列出
  - 状态
  - 调研

require_user:        # 写操作：需批准（对话内 / Web UI / 常驻授权）
  - 修改
  - 写入
  - 创建文件
  - 部署
  - 重启
  - 安装
  - 拉取
  - 提交
  - 推送

never_grant:         # 高危：只允许用户逐次批准，禁止常驻授权
  - 删除
  - 发布
  - 对外
  - 生产

# 未命中以上任何关键词的操作分类为 unknown，必须请求批准（fail-closed）。
