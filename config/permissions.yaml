# 权限模型 — 设计文档 §13
# Phase 1–4 依赖进程自觉 + 配置约束；强制隔离由 agentgateway（Phase 5）落地。
permissions:
  hermes:
    filesystem: rw:workspace
    shell: limited
    browser: rw
    nats: pub/sub
    sqlite: rw-lifecycle-commands   # 仅限 §22.3 规定的生命周期命令
    memory: rw
    a2a: client

  codex:
    filesystem: rw:assigned-project
    git: rw:assigned-repo
    shell: sandbox:project-scope
    nats: publish:task,artifact
    sqlite: none
    memory: none
    ssh: denied

  kimi:
    filesystem: read:task-context
    artifact: write:own-task
    shell: denied
    ssh: denied
    nats: publish:task
    memory: none

  fake:
    filesystem: rw:own-task-workspace
    shell: denied
    nats: publish:task
    sqlite: none
    memory: none

# 危险操作 — 必须用户审批（设计文档 §18）
approval_required:
  - destructive_filesystem
  - git_force_push
  - production_ssh
  - docker_prune
  - database_ddl_delete
  - credential_change
  - external_publish
  - payment
