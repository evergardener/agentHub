# Structured ActionIntent policy (ADR-0004).
# Exact operation IDs only. Unknown operations always route to the user.

auto:
  - agent.discover
  - artifact.read
  - collaboration.request
  - filesystem.read
  - git.diff
  - git.status
  - test.run

hermes_approve:
  # Native adapters still need a signed, one-shot response.  The Hermes
  # supervisor may provide that response only after inspecting the normalized
  # command.read interaction; this is not direct adapter auto-delivery.
  - command.read
  - filesystem.create
  - filesystem.write
  - git.commit

require_user:
  - command.execute
  - database.write
  - dependency.install
  - deployment.apply
  - filesystem.delete
  - git.force_push
  - git.push
  - grant.create
  - network.publish
  - secret.access
  - service.restart
